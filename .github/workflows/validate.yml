name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (for JSON validation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validation script
        run: bash scripts/validate.sh
