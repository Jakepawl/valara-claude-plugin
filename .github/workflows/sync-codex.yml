name: Sync skills to valara-codex-plugin

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'README.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout valara-claude-plugin
        uses: actions/checkout@v4
        with:
          path: valara-claude-plugin

      - name: Checkout valara-codex-plugin
        uses: actions/checkout@v4
        with:
          repository: Jakepawl/valara-codex-plugin
          token: ${{ secrets.CODEX_SYNC_TOKEN }}
          path: valara-codex-plugin

      - name: Sync skills
        run: |
          cd valara-codex-plugin
          rsync -av --delete ../valara-claude-plugin/skills/ ./skills/

      - name: Open PR if changes
        env:
          GH_TOKEN: ${{ secrets.CODEX_SYNC_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd valara-codex-plugin
          if [ -z "$(git status --porcelain)" ]; then
            echo "No skill changes to sync."
            exit 0
          fi

          BRANCH="sync-from-claude-plugin-${SOURCE_SHA}"
          # Cycle 3 finding H5: use GitHub's documented Actions-author convention
          # (no mailbox required, no Rule 17 mail-server config conflict).
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH"
          git add skills/
          git commit -m "chore: sync skills from valara-claude-plugin@${SOURCE_SHA}"
          git push origin "$BRANCH"

          gh pr create \
            --title "Sync skills from valara-claude-plugin@${SOURCE_SHA}" \
            --body "Auto-sync from canonical valara-claude-plugin. Source commit: https://github.com/Jakepawl/valara-claude-plugin/commit/${SOURCE_SHA}" \
            --base main \
            --head "$BRANCH"
